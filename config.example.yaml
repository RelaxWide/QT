# QT 전략 파라미터 — 이 파일을 config.yaml로 복사 후 사용
# cp config.example.yaml config.yaml

data:
  universe: "sp500"
  start_date: "2015-01-01"
  end_date: null
  cache_dir: "data/raw"
  source: "yfinance"

risk:
  risk_per_trade_pct: 0.7
  max_positions: 10
  max_sector_pct: 30
  max_correlation: 0.7
  slippage_pct: 0.1
  commission_usd: 0.0

circuit_breaker:
  daily_loss_pct: 1.5
  weekly_loss_pct: 3.0
  monthly_drawdown_pct: 5.0
  cumulative_drawdown_pct: 10.0

regime_filter:
  spy_ma_short: 50
  spy_ma_long: 200
  vix_threshold: 30
  vix_cooldown_days: 5

phase1_breakout_pullback:
  donchian_period: 20
  atr_period: 20
  pullback_atr_mult: 0.5
  pullback_max_bars: 5
  stop_atr_mult: 1.5
  target_r_multiple: 3.0
  trail_donchian_period: 10
  min_price_usd: 10
  min_avg_volume: 500000

phase2_cloud_support:
  tenkan_period: 9
  kijun_period: 26
  senkou_b_period: 52
  chikou_offset: 26
  cloud_thickness_min_pct: 3.0
  box_width_max_pct: 8.0
  cloud_top_touch_tolerance: 0.005
  stop_atr_mult_below_senkou_a: 0.5
  min_rr_to_box_top: 1.0
  split_entry_weights: [0.6, 0.4]
  partial_exit_r_multiples: [1.5, 3.0]
  partial_exit_weights: [0.5, 0.3]
  move_stop_to_breakeven_at_target1: true
  trail_indicator: "tenkan"

phase3_hybrid:
  cloud_filter_thickness_min_pct: 2.5
  cloud_filter_use_chikou: false

phase4_factor_stack:
  use_momentum:         false
  use_bbwidth:          false
  use_spy_rs:           true
  min_factors_required: 1
  momentum_period:      63
  momentum_top_pct:     30
  bbwidth_period:       20
  bbwidth_bottom_pct:   20

phase4_v3:
  # Research-only switches. Keep disabled until an extended backtest candidate clears adoption criteria.
  max_cloud_gap_pct: null
  min_cloud_thickness_pct: null
  require_support_touch: false
  support_touch_tolerance: 0.005
  require_bullish_reclaim: false
  require_tenkan_reclaim: false
  partial_exit_r_multiples: null
  partial_exit_weights: null
  trail_level: "donchian"
  use_trend_template: false
  trend_ma_short: 50
  trend_ma_mid: 150
  trend_ma_long: 200
  trend_long_rising_lookback: 30
  trend_high52_min_ratio: 0.75
  trend_low52_min_ratio: 1.30
  volume_avg_period: 20
  breakout_volume_mult: null
  pullback_volume_max_ratio: null
  max_recent_atr_to_long_atr_ratio: null
  contraction_atr_period: 20
  contraction_recent_period: 10
  contraction_long_period: 50
  use_52w_high_rank: false
  high52_rank_top_pct: 30
  require_pocket_pivot: false
  pocket_pivot_lookback: 10
  pocket_pivot_ma_short: 10
  pocket_pivot_ma_long: 50
  atr_pct_period: 20
  atr_pct_max: null
  rsi_period: 14
  rsi_min: null
  rsi_max: null
  adx_period: 14
  adx_min: null
  adx_require_plus_di: true

haa_strategy:
  offensive: ["SPY", "IWM", "VWO", "VEA", "VNQ", "DBC", "IEF", "TLT", "QQQ"]
  defensive: ["BIL", "IEF"]
  canary: "TIP"
  top_n: 4
  score_method: "equal"

gem_strategy:
  lookback_months: 12
  bond_proxy: "AGG"

monthly_momentum:
  universe: ["SPY", "EEM", "TLT"]
  lookback_months: 1

gtaa_strategy:
  assets: ["SPY", "EFA", "VNQ", "IEF", "DBC"]
  cash_proxy: "BIL"
  sma_months: 10

telegram:
  # 환경변수 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 사용 권장
  # GitHub Actions: Settings → Secrets에 등록
  bot_token: ""
  chat_id:   ""

high52_strategy:
  period_52week:      252
  volume_mult:        1.5
  ma200_period:       200
  atr_period:         20
  stop_atr_mult:      2.0
  trail_pct:          0.25
  min_price_usd:      10
  min_avg_volume:     500000
  no_january_entry:   true

high52_backtest:
  max_positions:      10

faber_taa:
  universe: ["SPY", "EFA", "GLD", "IEF", "VNQ"]
  sma_months: 10

faber_backtest: {}

alvarez_strategy:
  trend_ma_period:    100
  lower_lows_n:       3
  atr_period:         10
  rsi_period:         2
  rsi_entry_max:      20
  rsi_exit_min:       70
  limit_atr_mult:     0.5
  stop_atr_mult:      2.5
  min_price_usd:      10
  min_avg_volume:     500000

alvarez_backtest:
  position_size_pct:  10.0
  max_positions:      10
  max_hold_days:      10

ibs_strategy:
  ibs_threshold:       0.20
  ma200_period:        200
  atr_period:          14
  stop_atr_mult:       3.0
  five_day_low_bars:   5
  min_price_usd:       10
  min_avg_volume:      500000

ibs_backtest:
  position_size_pct:   15.0
  max_positions:       5
  max_hold_days:       5

clenow_strategy:
  reg_lookback:      90
  ma100_period:     100
  ma50_period:       50
  atr_period:        20
  atr_pct_max:     0.12
  min_score:        0.15
  spy_ma200_period: 200
  max_positions:     20

weinstein_strategy:
  ma30_period:        30
  volume_mult:       2.0
  high52_within_pct: 0.20
  min_price_usd:      10
  max_positions:      15

tps_strategy:
  universe: ["SPY", "QQQ", "IWM", "EFA", "EEM", "GLD", "IYR", "XLF", "XLE", "XLK"]
  rsi_period:      2
  rsi_entry_max:  25     # 2일 연속 RSI<25 → 1차 진입
  rsi_exit_min:   70     # RSI>70 → 전 레이어 청산
  ma_period:     200     # 트렌드 필터

connors_rsi_strategy:
  entry_threshold:    5      # CRSI < 5 일 때 진입
  exit_threshold:    70      # CRSI > 70 일 때 청산
  short_ma_period:    5      # 종가 > 5MA 청산
  ma200_period:     200      # 트렌드 필터
  vol_avg_period:    50
  min_price_usd:     10
  min_avg_volume: 500000
  position_size_pct: 10      # 자본의 10%
  max_positions:      5
  stop_pct:        0.05      # 진입가 -5% 손절

vcp_strategy:
  ma50_period:               50
  ma150_period:             150
  ma200_period:             200
  high52_within_pct:       0.25
  low52_above_pct:         0.30
  rs_rank_min:               70
  vcp_window:                60
  min_contractions:           2
  last_contraction_max_pct: 0.10
  volume_breakout_mult:     1.4
  volume_avg_period:         50
  stop_loss_pct:           0.07
  trail_ma_period:           20
  spy_ma200_period:         200
  max_positions:             10

residual_strategy:
  beta_window:       252   # beta 추정 기간 (1년 일별 수익)
  lookback:          252   # 잔차 누적 기간 (12개월)
  skip:               21   # 단기 반전 제거 (1개월)
  ma100_period:      100
  atr_period:         20
  atr_pct_max:      0.12
  min_price_usd:      10
  min_score:         0.05
  spy_ma200_period:  200
  max_positions:      20

backtest:
  initial_capital_usd: 100000        # US 백테스트 (USD)
  initial_capital_krw: 50000000      # KR 백테스트 (KRW, 5천만원)
  results_dir: "backtest_results"
  monte_carlo_runs: 1000
  wfo_train_years: 3
  wfo_test_years: 1

# ── KW (강환국 류) 펀더멘털 전략 (KR 전용) ──────────────────────────────
kw_super_value:
  rebalance_months: [5, 8, 11, 4]
  rebalance_dom:    [16, 16, 16, 1]
  small_cap_pct: 0.20
  top_n: 20
  min_per: 0.5
  max_per: 100
  min_pbr: 0.1

kw_super_quality:
  rebalance_months: [5, 8, 11, 4]
  rebalance_dom:    [16, 16, 16, 1]
  small_cap_pct: 0.20
  top_n: 20
  vol_lookback_days: 120
  min_roe: 0.0

kw_ultra:
  rebalance_months: [5, 8, 11, 4]
  rebalance_dom:    [16, 16, 16, 1]
  small_cap_pct: 0.30
  top_n: 20
  component_weights:
    value:    0.4
    quality:  0.3
    momentum: 0.3
  momentum_lookback_months: 12
  exclude_recent_month: true
  use_regime: true
  regime_index: "^KS11"
  regime_ma: 200
