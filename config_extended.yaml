clenow_strategy:
  reg_lookback:     90      # 지수회귀 기간 (거래일)
  ma100_period:     100     # 개별주 상승추세 필터
  ma50_period:      50      # MA50 > MA100 추가 필터 (단기 강세)
  spy_ma200_period: 200     # SPY 레짐 필터
  atr_period:       20
  atr_pct_max:      0.12    # ATR/close < 12% (강화: 과변동 제외)
  min_score:        0.15    # 최소 모멘텀 스코어 (저모멘텀 제외)
  min_price_usd:    10
  max_positions:    20      # 상위 20종목

double7_strategy:
  ma200_period:   200
  low7_period:    7
  high7_period:   7
  atr_period:     20
  stop_atr_mult:  3.0    # 재앙 방지용 손절 (넓게 — 드물게 발동)

double7_backtest:
  max_positions:    3    # ETF 3개 (SPY/QQQ/IWM)
  position_size_pct: 33.0

capital_mgmt:
  max_new_entries_day:  5    # 하루 최대 신규 진입 종목 수
  max_daily_invest_pct: 20   # 하루 최대 투자 = 총자산의 20%
  target_invested_pct:  70   # 목표 투자 비중 (이 이상이면 신규 진입 보류)

backtest:
  initial_capital_usd: 100000
  results_dir: "backtest_results"
  monte_carlo_runs: 1000
  wfo_train_years: 3
  wfo_test_years: 1

