# KIS 자동매매 설정 템플릿
# 사용법: cp config_live.example.yaml config_live.yaml 후 실제 값 입력
# 절대 git에 커밋하지 말 것 (.gitignore에 등록되어 있음)

kis:
  mode: "prod"              # "mock" (모의투자) | "prod" (실계좌)
  app_key:    ""
  app_secret: ""

  # 모의투자 계좌번호 (모의투자 신청 후 발급 — 8자리-2자리)
  mock_account_no:  ""
  # 실계좌 계좌번호 (Phase G 진입 시에만 사용)
  prod_account_no:  ""

  # 해외주식 거래 시장 코드
  exchange: "NASD"          # NASD(나스닥) | NYSE | AMEX

  # API endpoints (변경 불필요)
  base_url_mock: "https://openapivts.koreainvestment.com:29443"
  base_url_prod: "https://openapi.koreainvestment.com:9443"

# 자본 배분 (USD)
# 합성 60:40 (Clenow + Weinstein) 권장 배분 — Phase 4 는 페이퍼 전용
#
# 모드 1 (auto_allocate=true, 권장): 매수 직전 KIS 잔고 조회해 비율 적용
#   - 입출금 시 config 수정 불필요
#   - 잔고 조회는 OrderManager 인스턴스당 1회만 (토큰 가드와 양립)
#
# 모드 2 (auto_allocate=false): clenow_usd / weinstein_usd 명시값 사용
capital:
  auto_allocate: true          # true: KIS 잔고 기준 동적 / false: 아래 _usd 값 사용
  buffer_pct:      1.0         # 잔고의 1% 는 미배분 (수수료/환차 버퍼)
  clenow_pct:     60           # auto_allocate 시 적용 비율 (합산 100)
  weinstein_pct:  40
  phase4_pct:      0           # Phase 4 는 페이퍼 전용
  clenow_max_positions:    5   # 백테스트 사양은 20, $10k 자본 한계로 5 권장
  weinstein_max_positions: 4   # 백테스트 사양은 15, 동일 사유로 4

  # 명시값 (auto_allocate=false 일 때만 사용)
  total_usd:     10000
  phase4_usd:        0
  clenow_usd:     6000
  weinstein_usd:  4000

# 리스크 가드
risk_guard:
  daily_loss_pct:       1.5    # 당일 -1.5% 시 신규 진입 차단
  max_drawdown_pct:    10.0    # 누적 -10% 시 전면 정지
  consecutive_losses:   5      # 5연속 손실 시 1주일 보류
  max_order_pct_of_capital: 50  # 단일 주문 한도 (오류 보호)

# 로그·텔레그램 (paper 와 동일 채널 사용 가능, 별도 분리 권장)
notify:
  telegram_token:   ""
  telegram_chat_id: ""
