# KIS 자동매매 설정 템플릿 (US + KR 통합)
# 사용법: cp config_live.example.yaml config_live.yaml 후 실제 값 입력
# 절대 git에 커밋하지 말 것 (.gitignore에 등록되어 있음)
#
# 시장별 분리 키 (권장):
#   kis.us_app_key / kis.us_app_secret / kis.us_mock_account_no / kis.us_prod_account_no
#   kis.kr_app_key / kis.kr_app_secret / kis.kr_mock_account_no / kis.kr_prod_account_no
# 단일 키 호환:
#   kis.app_key / kis.app_secret / kis.mock_account_no / kis.prod_account_no  (기존)

kis:
  mode: "prod"

  # 공통 키 (단일 KIS Developers 앱이 US/KR 둘 다 거래 가능하면 동일 값 사용)
  app_key:    ""
  app_secret: ""

  # ── US 계좌번호 ────────────────────────────────────────────────
  us_mock_account_no:  ""        # 미국 모의투자 계좌
  us_prod_account_no:  ""        # 미국 실계좌

  # 미국 거래소 코드 (시세/주문에 사용)
  exchange: "NASD"               # NASD | NYSE | AMEX

  # ── KR 계좌번호 (한국 주식 거래용) ─────────────────────────────
  # KIS 모의투자는 시장별로 별도 신청 필요 — 한국주식 모의 신청 후 발급
  kr_mock_account_no:  ""
  kr_prod_account_no:  ""

  # 모드를 시장별로 다르게 두려면:
  # us_mode: "prod"
  # kr_mode: "mock"

  # API endpoints (변경 불필요)
  base_url_mock: "https://openapivts.koreainvestment.com:29443"
  base_url_prod: "https://openapi.koreainvestment.com:9443"

  # 기존 호환 (단일 모드만 운영하는 경우)
  mock_account_no:  ""
  prod_account_no:  ""

# ── US 자본 배분 ──────────────────────────────────────────────────
# 합성 60:40 (Clenow + Weinstein), Phase 4 는 페이퍼 전용
# auto_allocate=true 면 KIS 잔고 기준 동적 (입출금 시 config 수정 불필요)
us:
  capital:
    auto_allocate: true
    buffer_pct:      1.0
    clenow_pct:     60
    weinstein_pct:  40
    phase4_pct:      0
    clenow_max_positions:    5
    weinstein_max_positions: 4
    # 명시값 (auto_allocate=false 일 때 사용)
    total_usd:    10000
    phase4_usd:       0
    clenow_usd:    6000
    weinstein_usd: 4000

# ── KR 자본 배분 (KOSPI 전체, KRW) ──────────────────────────────────
# 2026-05-19 update: KW Super Value 단일 채택 (Clenow KR / Weinstein KR / Quality 전부 폐기)
# 18년 컷오프 검증: CAGR 30.79%, Sharpe 1.30, alpha vs KOSPI +27%p
# 분기 4회 (5/16, 8/16, 11/16, 4/1) 만 매매. 평소 매매 없음.
#
# 종목당 자본 = (KRW 잔고 × 0.99) / top_n
# 예: ₩10,000,000 입금 → 종목당 약 ₩550,000 × top_n=18 종목
kr:
  mode: "mock"           # mock → prod 단계 진행. 모의 신청 후 prod 전환
  capital:
    auto_allocate: true   # KIS KRW 잔고 자동 조회 (입출금 시 config 수정 불필요)
    buffer_pct:      1.0
    kw_super_value_pct: 100      # KR 트랙 100% KW SV
    kw_super_value_max_positions: 18   # sensitivity 10x10 최적 (Calmar 0.88)
    # 명시값 (auto_allocate=false 일 때, KRW)
    total_krw:            10000000
    kw_super_value_krw:   10000000

# 최상위 capital (기존 호환 — us 섹션 없으면 폴백)
capital:
  auto_allocate: true
  buffer_pct:      1.0
  clenow_pct:     60
  weinstein_pct:  40
  phase4_pct:      0
  clenow_max_positions:    5
  weinstein_max_positions: 4
  total_usd:     10000
  phase4_usd:        0
  clenow_usd:     6000
  weinstein_usd:  4000

# 리스크 가드
risk_guard:
  daily_loss_pct:       1.5    # 당일 -1.5% 시 신규 진입 차단
  max_drawdown_pct:    10.0    # 누적 -10% 시 전면 정지
  consecutive_losses:   5      # 5연속 손실 시 1주일 보류
  max_order_pct_of_capital: 50  # 단일 주문 한도 (오류 보호)

# 로그·텔레그램 (paper 와 동일 채널 사용 가능, 별도 분리 권장)
notify:
  telegram_token:   ""
  telegram_chat_id: ""
