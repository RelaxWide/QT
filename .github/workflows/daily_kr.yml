name: Daily Paper Trading (KR)

# KOSPI 정규장 마감 (KST 15:30) 후 1시간 마진.
# KST 16:30 = UTC 07:30
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-daily-kr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.yaml config.yaml

      - name: Run KR daily script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_kr.py --force

      - name: Commit KR state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch paper_trading/trades_clenow_kr.csv paper_trading/trades_weinstein_kr.csv paper_trading/daily_nav_kr.csv
          git add paper_trading/positions_clenow_kr.json paper_trading/trades_clenow_kr.csv \
                  paper_trading/positions_weinstein_kr.json paper_trading/trades_weinstein_kr.csv \
                  paper_trading/daily_nav_kr.csv || true
          git diff --staged --quiet || git commit -m "chore: KR daily state $(date -u +%Y-%m-%d)"
          git pull --rebase origin master || true
          git push origin master || true
