name: KIS Live Smoke Test ($100)

# 수동 실행 전용 — 실 계좌에 실제 매수 주문이 발생합니다.
# Repository Secrets 에 다음 항목이 등록되어 있어야 합니다:
#   KIS_PROD_APP_KEY
#   KIS_PROD_APP_SECRET
#   KIS_PROD_ACCOUNT       (예: "44474877-01")
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
on:
  workflow_dispatch:
    inputs:
      clenow_budget:
        description: "Clenow 예산 (USD)"
        required: true
        default: "60"
        type: string
      weinstein_budget:
        description: "Weinstein 예산 (USD)"
        required: true
        default: "40"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config.yaml
        run: cp config.example.yaml config.yaml

      - name: Generate config_live.yaml from secrets
        env:
          KIS_PROD_APP_KEY:    ${{ secrets.KIS_PROD_APP_KEY }}
          KIS_PROD_APP_SECRET: ${{ secrets.KIS_PROD_APP_SECRET }}
          KIS_PROD_ACCOUNT:    ${{ secrets.KIS_PROD_ACCOUNT }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CLENOW_BUDGET:       ${{ inputs.clenow_budget }}
          WEINSTEIN_BUDGET:    ${{ inputs.weinstein_budget }}
        run: |
          python - <<'PY'
          import os
          import yaml
          cl  = float(os.environ["CLENOW_BUDGET"])
          we  = float(os.environ["WEINSTEIN_BUDGET"])
          tot = cl + we
          cfg = {
              "kis": {
                  "mode": "prod",
                  "app_key":    os.environ["KIS_PROD_APP_KEY"],
                  "app_secret": os.environ["KIS_PROD_APP_SECRET"],
                  "mock_account_no": "00000000-00",
                  "prod_account_no": os.environ["KIS_PROD_ACCOUNT"],
                  "exchange": "NASD",
                  "base_url_mock": "https://openapivts.koreainvestment.com:29443",
                  "base_url_prod": "https://openapi.koreainvestment.com:9443",
              },
              "capital": {
                  "total_usd":               tot,
                  "phase4_usd":              0,
                  "clenow_usd":              cl,
                  "weinstein_usd":           we,
                  "clenow_max_positions":    1,
                  "weinstein_max_positions": 1,
              },
              "risk_guard": {
                  "daily_loss_pct":          50.0,
                  "max_drawdown_pct":        50.0,
                  "consecutive_losses":      99,
                  "max_order_pct_of_capital": 100,
              },
              "notify": {
                  "telegram_token":   os.environ["TELEGRAM_BOT_TOKEN"],
                  "telegram_chat_id": os.environ["TELEGRAM_CHAT_ID"],
              },
          }
          with open("config_live.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, allow_unicode=True, sort_keys=False)
          print("[setup] config_live.yaml 생성 완료")
          print(f"[setup] 예산: Clenow ${cl} / Weinstein ${we} / total ${tot}")
          PY

      - name: Telegram - Start
        env:
          TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHATID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CL:     ${{ inputs.clenow_budget }}
          WE:     ${{ inputs.weinstein_budget }}
        run: |
          MSG="🧪 KIS LIVE Smoke Test 시작 — prod 실계좌 매수 (Clenow \$${CL} + Weinstein \$${WE})"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${CHATID}" \
               --data-urlencode "text=${MSG}" > /dev/null

      - name: Generate buy candidates (pending.json)
        run: |
          python scripts/smoke_test_setup.py \
            --clenow-budget    ${{ inputs.clenow_budget }} \
            --weinstein-budget ${{ inputs.weinstein_budget }}

      - name: Show pending file
        run: |
          if [ -f live_trading/wed_buy_pending.json ]; then
            echo "--- wed_buy_pending.json ---"
            cat live_trading/wed_buy_pending.json
          else
            echo "pending 파일 없음 - 후보 0건"
          fi

      - name: Execute KIS LIMIT buy orders (no-wait)
        run: python scheduler/wednesday_morning_buy.py --no-wait

      - name: Telegram - Done
        if: success()
        env:
          TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHATID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ Smoke Test 완료 — KIS 잔고에서 체결 확인 필요"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${CHATID}" \
               --data-urlencode "text=${MSG}" > /dev/null

      - name: Telegram - Fail
        if: failure()
        env:
          TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHATID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="❌ Smoke Test 실패 — 로그 확인: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${CHATID}" \
               --data-urlencode "text=${MSG}" > /dev/null
